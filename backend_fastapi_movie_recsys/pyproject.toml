[project]
name = "backend-fastapi-movie-recsys"
version = "0.1.0"
description = "FastAPI movie recommender backend backed by MySQL."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "SQLAlchemy==2.0.52",
    "PyMySQL==1.2.0",
    "python-dotenv==1.2.3",
    "scikit-learn==1.9.0",
    "numpy==2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
